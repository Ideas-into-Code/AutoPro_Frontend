<app-page-shell>
  <app-header
    header
    brand="AutoPro"
    brandLink="/mecanicien"
    brandLabel="AutoPro — Tableau de bord mécanicien"
  >
    <!--
      Toutes les destinations restent sous `/mecanicien` : un lien vers une
      route cliente ferait sortir de cet espace, coquille comprise.
    -->
    <a
      nav
      routerLink="/mecanicien"
      routerLinkActive="ap-mecano-shell__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      Tableau de bord
    </a>
    <a
      nav
      routerLink="/mecanicien/interventions"
      routerLinkActive="ap-mecano-shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Mes interventions
    </a>
    <a
      nav
      routerLink="/mecanicien/tarifs"
      routerLinkActive="ap-mecano-shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Mes tarifs
    </a>

    <!-- Identifie qui est connecté, plutôt qu'une mention générique. -->
    <span actions class="ap-mecano-shell__user">{{ nomAffiche() }}</span>
  </app-header>

  <router-outlet />

  <app-footer footer>
    <a link routerLink="/mecanicien">Tableau de bord</a>
    <a link routerLink="/mecanicien/profil">Mon profil</a>
  </app-footer>
</app-page-shell>
