<app-page-shell>
  <app-header header brand="AutoPro">
    <!--
      Liens de navigation desktop uniquement.
      Sur mobile, la navigation est assurée par la bottom nav bar ci-dessous.
    -->
    <a
      nav
      routerLink="/accueil"
      routerLinkActive="ap-client-shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Accueil
    </a>
    <a
      nav
      routerLink="/mecaniciens"
      routerLinkActive="ap-client-shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Mécaniciens
    </a>
    <a
      nav
      routerLink="/carte"
      routerLinkActive="ap-client-shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Carte
    </a>
    <a
      nav
      routerLink="/demandes"
      routerLinkActive="ap-client-shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Mes demandes
    </a>
    <a
      nav
      routerLink="/vehicules"
      routerLinkActive="ap-client-shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Mes véhicules
    </a>
    <a
      nav
      routerLink="/messages"
      routerLinkActive="ap-client-shell__link--active"
      ariaCurrentWhenActive="page"
    >
      Messages
    </a>

    <div actions class="ap-client-shell__actions">
      @if (auth.isAuthenticated()) {
        <app-notification-bell />
        <a class="ap-client-shell__account" routerLink="/profil" aria-label="Mon profil">
          <app-avatar [name]="nomAffiche()" size="sm" />
        </a>
        <button
          type="button"
          class="ap-client-shell__logout"
          (click)="deconnexion()"
          aria-label="Déconnexion"
        >
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
        </button>
      } @else {
        <a appButton variant="primary" size="sm" routerLink="/compte/connexion">Se connecter</a>
      }
    </div>
  </app-header>

  <router-outlet />

  <!-- Footer desktop uniquement -->
  <app-footer footer class="ap-client-shell__footer-desktop">
    <a link routerLink="/accueil">Accueil</a>
    <a link routerLink="/demandes/signaler">Signaler un problème</a>
    <a link routerLink="/messages">Messages</a>
  </app-footer>
</app-page-shell>

<!-- ── Bottom Navigation Bar — mobile uniquement ── -->
<app-bottom-nav [items]="navItems" ariaLabel="Navigation principale" />
