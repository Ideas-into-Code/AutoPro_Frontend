<!--
  Un seul <svg> enveloppe tous les tracés : la grille (24×24), l'épaisseur de
  trait et les jointures sont donc décrites une fois, et chaque cas ne contient
  que la géométrie propre au pictogramme.

  `stroke="currentColor"` fait hériter la couleur du texte environnant : une
  icône posée dans un bouton primaire se colore seule, sans variante de style.
-->
<svg
  class="ap-icon__glyph"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.role]="isDecorative() ? null : 'img'"
  [attr.aria-hidden]="isDecorative() ? 'true' : null"
  [attr.aria-label]="isDecorative() ? null : label()"
>
  @switch (name()) {
    @case ('recherche') {
      <circle cx="11" cy="11" r="7" />
      <line x1="16.3" y1="16.3" x2="21" y2="21" />
    }

    @case ('sos') {
      <path d="M12 3.8 21.2 19.4H2.8Z" />
      <line x1="12" y1="9.8" x2="12" y2="14" />
      <line x1="12" y1="16.8" x2="12" y2="16.9" />
    }

    @case ('batterie') {
      <rect x="2.8" y="7.6" width="16.4" height="9.8" rx="2" />
      <line x1="21.2" y1="10.8" x2="21.2" y2="14.2" />
      <line x1="7.2" y1="12.5" x2="10.8" y2="12.5" />
      <line x1="9" y1="10.7" x2="9" y2="14.3" />
      <line x1="13.6" y1="12.5" x2="17.2" y2="12.5" />
    }

    @case ('pneu') {
      <circle cx="12" cy="12" r="8.8" />
      <circle cx="12" cy="12" r="3.4" />
      <line x1="12" y1="3.2" x2="12" y2="8.6" />
      <line x1="12" y1="15.4" x2="12" y2="20.8" />
      <line x1="3.2" y1="12" x2="8.6" y2="12" />
      <line x1="15.4" y1="12" x2="20.8" y2="12" />
    }

    @case ('freinage') {
      <circle cx="12" cy="12" r="8.8" />
      <circle cx="12" cy="12" r="2.6" />
      <circle cx="12" cy="6.4" r="0.1" />
      <circle cx="16.8" cy="14.4" r="0.1" />
      <circle cx="7.2" cy="14.4" r="0.1" />
    }

    @case ('remorquage') {
      <path d="M2.8 16.4V7.2h8.6v9.2" />
      <path d="M11.4 10.8h3.8l3.4 3.4v2.2" />
      <circle cx="7" cy="17.6" r="1.9" />
      <circle cx="16.6" cy="17.6" r="1.9" />
      <line x1="15.4" y1="7.2" x2="21.2" y2="4.4" />
    }

    @case ('climatisation') {
      <line x1="12" y1="3.2" x2="12" y2="20.8" />
      <line x1="4.4" y1="7.6" x2="19.6" y2="16.4" />
      <line x1="4.4" y1="16.4" x2="19.6" y2="7.6" />
      <path d="M9.6 5.6 12 8l2.4-2.4" />
      <path d="M9.6 18.4 12 16l2.4 2.4" />
    }

    @case ('electricite') {
      <path d="M13.4 2.8 5.6 13.2h5.2l-1 8 8.6-10.8h-5.4Z" />
    }

    @case ('cle') {
      <path
        d="M15.2 6.2a4.2 4.2 0 0 0-5.7 5.7L3.6 17.8v2.6h2.6l5.9-5.9a4.2 4.2 0 0 0 5.7-5.7l-2.6 2.6-2.6-2.6Z"
      />
    }

    @case ('position') {
      <path d="M12 21.2s7.2-6.5 7.2-11.4a7.2 7.2 0 1 0-14.4 0C4.8 14.7 12 21.2 12 21.2Z" />
      <circle cx="12" cy="9.8" r="2.6" />
    }

    @case ('fleche-droite') {
      <line x1="3.6" y1="12" x2="19.4" y2="12" />
      <polyline points="13.4 6 19.4 12 13.4 18" />
    }

    @case ('croix') {
      <line x1="6" y1="6" x2="18" y2="18" />
      <line x1="18" y1="6" x2="6" y2="18" />
    }

    @case ('cloche') {
      <path d="M18 9.6a6 6 0 0 0-12 0c0 5.2-2 6.8-2 6.8h16s-2-1.6-2-6.8Z" />
      <path d="M13.7 20.2a2 2 0 0 1-3.4 0" />
    }

    @case ('tendance') {
      <polyline points="3.2 16.8 9.4 10.6 13 14.2 20.8 6.4" />
      <polyline points="15.2 6.4 20.8 6.4 20.8 12" />
    }

    @case ('valide') {
      <circle cx="12" cy="12" r="8.8" />
      <polyline points="8.2 12.2 11 15 15.8 9.4" />
    }

    @case ('annule') {
      <circle cx="12" cy="12" r="8.8" />
      <line x1="9" y1="9" x2="15" y2="15" />
      <line x1="15" y1="9" x2="9" y2="15" />
    }

    @case ('accueil') {
      <path d="M3.6 10.4 12 3.6l8.4 6.8v9a1.4 1.4 0 0 1-1.4 1.4H5a1.4 1.4 0 0 1-1.4-1.4Z" />
      <polyline points="9.4 20.8 9.4 13.4 14.6 13.4 14.6 20.8" />
    }

    @case ('carte') {
      <polygon points="2.8 6.4 9.2 3.6 14.8 6.4 21.2 3.6 21.2 17.6 14.8 20.4 9.2 17.6 2.8 20.4" />
      <line x1="9.2" y1="3.6" x2="9.2" y2="17.6" />
      <line x1="14.8" y1="6.4" x2="14.8" y2="20.4" />
    }

    @case ('profil') {
      <circle cx="12" cy="8.2" r="3.8" />
      <path d="M4.8 20.4a7.2 7.2 0 0 1 14.4 0" />
    }

    @case ('liste') {
      <rect x="5.2" y="3.4" width="13.6" height="17.2" rx="2" />
      <line x1="8.6" y1="8.4" x2="15.4" y2="8.4" />
      <line x1="8.6" y1="12" x2="15.4" y2="12" />
      <line x1="8.6" y1="15.6" x2="13" y2="15.6" />
    }

    @case ('message') {
      <path d="M20.4 15.2a2 2 0 0 1-2 2H7.6L3.6 21.2V5.6a2 2 0 0 1 2-2h12.8a2 2 0 0 1 2 2Z" />
    }

    @case ('voiture') {
      <path d="M3.2 16.4v-3.2l2-4.4A2 2 0 0 1 7 7.6h10a2 2 0 0 1 1.8 1.2l2 4.4v3.2" />
      <line x1="3.2" y1="13.2" x2="20.8" y2="13.2" />
      <circle cx="7.2" cy="16.6" r="1.6" />
      <circle cx="16.8" cy="16.6" r="1.6" />
    }

    <!-- Deux silhouettes : un groupe de personnes, pas un individu. -->
    @case ('groupes') {
      <circle cx="9.4" cy="8.6" r="3.4" />
      <path d="M2.8 19.6a6.6 6.6 0 0 1 13.2 0" />
      <path d="M16.2 5.6a3.4 3.4 0 0 1 0 6" />
      <path d="M17.8 13.6a6.6 6.6 0 0 1 3.4 5.4" />
    }

    @case ('paiement') {
      <rect x="2.8" y="5.6" width="18.4" height="12.8" rx="2" />
      <line x1="2.8" y1="9.8" x2="21.2" y2="9.8" />
      <line x1="6.6" y1="14.4" x2="10.4" y2="14.4" />
    }
  }
</svg>
